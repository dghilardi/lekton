name: Build Binaries

# Builds the release binaries for every supported platform and packages them
# (archives, .deb, SHA256SUMS) into the `release-assets` artifact.
# Called by publish.yml on tags; runs on pull requests touching the packaging.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-binaries.yml
      - packaging/**
      - scripts/package-*.sh
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The WASM/JS/CSS site is platform independent: build it once and ship it
  # next to every server binary.
  site:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves caches: PR-scoped caches are unreachable from other
          # refs and evict main's under the 10 GB repository limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-leptos@0.3.10,wasm-bindgen-cli@0.2.129

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Expose local Tailwind CLI
        run: |
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "TAILWINDCSS_BINARY=$PWD/node_modules/.bin/tailwindcss" >> "$GITHUB_ENV"

      - name: Build site
        run: |
          cargo leptos build --release --frontend-only
          bash scripts/stage-site-assets.sh
          test -f target/site/pkg/lekton.wasm
          test -f target/site/pkg/lekton.js
          test -f target/site/pkg/lekton.css

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: target/site/
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux server is built on the oldest supported Ubuntu to keep
          # the glibc requirement low (2.35: Ubuntu 22.04+, Debian 12+). It
          # stays dynamic because it loads libpdfium at runtime.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            server: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            server: true
          # The Linux CLI is fully static so it runs on any distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            sync: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
            sync: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            server: true
            sync: true
          - target: aarch64-apple-darwin
            os: macos-latest
            server: true
            sync: true
          # Cross-compiled on Apple Silicon: the binaries cannot run on the runner.
          - target: x86_64-apple-darwin
            os: macos-latest
            server: true
            sync: true
            cross: true

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install && rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install musl tools
        if: ${{ contains(matrix.target, 'musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # build.rs bundles the browser viewers from node_modules.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.server }}
        with:
          node-version: 22
          cache: 'npm'

      - if: ${{ matrix.server }}
        run: npm ci

      - name: Build lekton
        if: ${{ matrix.server }}
        # cargo-leptos normally provides this; the server reads it at compile time.
        env:
          LEPTOS_OUTPUT_NAME: lekton
        run: cargo build --release --locked --target ${{ matrix.target }} -p lekton --bin lekton --features ssr

      - name: Build lekton-sync
        if: ${{ matrix.sync }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p lekton-sync

      - name: Collect binaries
        run: |
          EXE=""
          [[ "${{ matrix.target }}" == *windows* ]] && EXE=".exe"
          mkdir -p dist
          for bin in lekton lekton-sync; do
            if [ -f "target/${{ matrix.target }}/release/${bin}${EXE}" ]; then
              cp "target/${{ matrix.target }}/release/${bin}${EXE}" dist/
            fi
          done

      - name: Smoke test lekton-sync
        if: ${{ matrix.sync && !matrix.cross }}
        run: ./dist/lekton-sync* --help > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [site, binaries]
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only our artifacts: on tags the run also holds Docker build records,
      # which download-artifact cannot extract.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: artifacts/site

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: artifacts

      - name: Package archives and Debian packages
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          for dir in artifacts/bin-*; do
            target="${dir#artifacts/bin-}"
            bash scripts/package-release.sh "$VERSION" "$target" "$dir" artifacts/site release
          done
          bash scripts/package-deb.sh "$VERSION" amd64 artifacts/bin-x86_64-unknown-linux-gnu \
            artifacts/bin-x86_64-unknown-linux-musl artifacts/site release
          bash scripts/package-deb.sh "$VERSION" arm64 artifacts/bin-aarch64-unknown-linux-gnu \
            artifacts/bin-aarch64-unknown-linux-musl artifacts/site release
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
          cat release/SHA256SUMS

      - name: Smoke test Debian packages
        run: |
          sudo apt-get install -y ./release/lekton_*_amd64.deb ./release/lekton-sync_*_amd64.deb
          lekton-sync --help > /dev/null
          systemctl cat lekton.service
          # Start the packaged server against the MongoDB service and check it
          # serves both SSR pages and the packaged site assets.
          sudo env LEPTOS_SITE_ROOT=/usr/share/lekton/site LEPTOS_SITE_ADDR=127.0.0.1:3000 \
            LKN__DATABASE__URI=mongodb://localhost:27017 LKN__DATABASE__NAME=lekton_smoke \
            LKN__AUTH__DEMO_MODE=true LKN__STORAGE__BUCKET=lekton-smoke \
            AWS_REGION=us-east-1 AWS_ACCESS_KEY_ID=smoke AWS_SECRET_ACCESS_KEY=smoke \
            /usr/bin/lekton > lekton.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3000/ || { cat lekton.log; exit 1; }
          curl -sf -o /dev/null http://127.0.0.1:3000/pkg/lekton.wasm
          curl -sf -o /dev/null http://127.0.0.1:3000/pkg/lekton.css
          curl -sf -o /dev/null http://127.0.0.1:3000/js/mermaid.esm.min.mjs
          echo "Packaged server is serving pages and assets"

      - name: Smoke test lekton-sync on Ubuntu 18.04
        # The static CLI must install and run on distributions older than the
        # server's glibc baseline.
        run: |
          docker run --rm -v "$PWD/release:/release:ro" ubuntu:18.04 sh -c \
            'dpkg -i /release/lekton-sync_*_amd64.deb && lekton-sync --help > /dev/null'
          tar -xzf release/lekton-sync-*-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP"
          docker run --rm -v "$RUNNER_TEMP:/sync:ro" ubuntu:18.04 sh -c \
            '/sync/lekton-sync-*-x86_64-unknown-linux-musl/lekton-sync --help > /dev/null'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7
