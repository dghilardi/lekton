name: Dependency Audit

on:
  push:
    branches: [main, "feat/*", "feature/*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny-action downloads its binary while building a Docker image,
      # without retries, so a transient GitHub release error failed the audit.
      # install-action retries downloads; the command matches the action's
      # defaults and its pinned cargo-deny version.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2

      - name: Check dependencies
        run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check
