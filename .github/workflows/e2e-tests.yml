name: E2E Tests

on:
  push:
    branches: [main, next, 'phase-*']
  pull_request:
    branches: [main, next]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  LKN__AUTH__DEMO_MODE: "true"
  LKN__AUTH__SERVICE_TOKEN: "test-token"
  LKN__DATABASE__URI: "mongodb://localhost:27017"
  LKN__DATABASE__NAME: "lekton_e2e"
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  AWS_REGION: "us-east-1"
  LKN__STORAGE__BUCKET: "lekton-e2e"
  LKN__STORAGE__ENDPOINT: "http://localhost:9000"
  LKN__SEARCH__URL: "http://localhost:7700"
  LKN__SEARCH__API_KEY: ""

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      meilisearch:
        image: getmeili/meilisearch:v1.13.3
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"
        options: >-
          --health-cmd "curl -f http://localhost:7700/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-leptos and wasm-bindgen-cli
        run: |
          cargo install cargo-leptos --locked
          cargo install wasm-bindgen-cli --version 0.2.118

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Expose local Tailwind CLI
        run: |
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "TAILWINDCSS_BINARY=$PWD/node_modules/.bin/tailwindcss" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data --address :9000
          # Wait for MinIO to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1

      - name: Create S3 bucket
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://lekton-e2e

      - name: Build application
        run: cargo leptos build --release

      - name: Check WASM bundle size
        run: |
          WASM_FILE=$(find target/site/pkg -name '*.wasm' | head -1)
          if [ -z "$WASM_FILE" ]; then
            echo "ERROR: no .wasm file found in target/site/pkg"
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$WASM_FILE")
          SIZE_KB=$((SIZE_BYTES / 1024))
          THRESHOLD_KB=5120  # 5 MB — adjust down once baseline is established
          echo "WASM bundle: $WASM_FILE — ${SIZE_KB} KB"
          if [ "$SIZE_BYTES" -gt $((THRESHOLD_KB * 1024)) ]; then
            echo "FAIL: WASM bundle (${SIZE_KB} KB) exceeds ${THRESHOLD_KB} KB threshold"
            exit 1
          fi
          echo "OK: WASM bundle is within threshold (${SIZE_KB} KB / ${THRESHOLD_KB} KB)"

      - name: Stage static assets into site root
        # Guarantee every served static asset is in target/site/js even when the
        # cargo build is fully cached (the public/ -> target/site/ sync is skipped).
        # Same script is used by the Dockerfile so e2e and production never drift.
        run: bash scripts/stage-site-assets.sh

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
