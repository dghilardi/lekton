name: E2E Tests

on:
  push:
    branches: [main, next, 'phase-*']
  pull_request:
    branches: [main, next]
  workflow_call:

# Supersede older runs of the same PR; runs on main and tags always complete.
# The group is a literal, not github.workflow, so it stays unique when called
# from publish.yml.
concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  LKN__AUTH__DEMO_MODE: "true"
  LKN__AUTH__SERVICE_TOKEN: "test-token"
  LKN__FEATURES__SEARCH: "true"
  LKN__DATABASE__URI: "mongodb://localhost:27017"
  LKN__DATABASE__NAME: "lekton_e2e"
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  AWS_REGION: "us-east-1"
  LKN__STORAGE__BUCKET: "lekton-e2e"
  LKN__STORAGE__ENDPOINT: "http://localhost:9000"
  LKN__SEARCH__URL: "http://localhost:7700"
  LKN__SEARCH__API_KEY: ""

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      meilisearch:
        image: getmeili/meilisearch:v1.54.3
        ports:
          - 7700:7700
        env:
          MEILI_NO_ANALYTICS: "true"
        options: >-
          --health-cmd "curl -f http://localhost:7700/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves caches: PR-scoped caches are unreachable from other
          # refs and evict main's under the 10 GB repository limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-leptos@0.3.10,wasm-bindgen-cli@0.2.129

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Expose local Tailwind CLI
        run: |
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "TAILWINDCSS_BINARY=$PWD/node_modules/.bin/tailwindcss" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data --address :9000
          # Wait for MinIO to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1

      - name: Create S3 bucket
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://lekton-e2e

      - name: Build application
        run: cargo leptos build --release

      - name: Check WASM bundle size
        run: |
          WASM_FILE=$(find target/site/pkg -name '*.wasm' | head -1)
          if [ -z "$WASM_FILE" ]; then
            echo "ERROR: no .wasm file found in target/site/pkg"
            exit 1
          fi
          SIZE_BYTES=$(stat -c%s "$WASM_FILE")
          SIZE_KB=$((SIZE_BYTES / 1024))
          THRESHOLD_KB=5120  # 5 MB — adjust down once baseline is established
          echo "WASM bundle: $WASM_FILE — ${SIZE_KB} KB"
          if [ "$SIZE_BYTES" -gt $((THRESHOLD_KB * 1024)) ]; then
            echo "FAIL: WASM bundle (${SIZE_KB} KB) exceeds ${THRESHOLD_KB} KB threshold"
            exit 1
          fi
          echo "OK: WASM bundle is within threshold (${SIZE_KB} KB / ${THRESHOLD_KB} KB)"

      - name: Stage static assets into site root
        # Guarantee every served static asset is in target/site/js even when the
        # cargo build is fully cached (the public/ -> target/site/ sync is skipped).
        # Same script is used by the Dockerfile so e2e and production never drift.
        run: bash scripts/stage-site-assets.sh

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
