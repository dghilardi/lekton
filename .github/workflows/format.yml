name: Code Quality

on:
  push:
    branches: [main, "feat/*", "feature/*"]
  pull_request:
    branches: [main]
  workflow_call:

# Supersede older runs of the same PR; runs on main and tags always complete.
# The group is a literal, not github.workflow, so it stays unique when called
# from publish.yml.
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install && rustup component add rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install && rustup component add clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves caches: PR-scoped caches are unreachable from other
          # refs and evict main's under the 10 GB repository limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Clippy (SSR)
        run: cargo clippy --features ssr --lib -- -D warnings

      - name: Clippy (hydrate)
        run: cargo clippy --features hydrate --lib -- -D warnings
