name: Integration Tests

on:
  push:
    branches: [main, next, 'phase-*']
  pull_request:
    branches: [main, next]
  workflow_call:

# Supersede older runs of the same PR; runs on main and tags always complete.
# The group is a literal, not github.workflow, so it stays unique when called
# from publish.yml.
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main saves caches: PR-scoped caches are unreachable from other
          # refs and evict main's under the 10 GB repository limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # Same libpdfium as the Dockerfile; keep the release and checksum in sync.
      - name: Install libpdfium
        env:
          PDFIUM_RELEASE: "8076"
          PDFIUM_SHA256: d9d67bc40af03aef4fe28a60b19b1086f28ace019c8c9caf19cb7fe3d14ceca3
        run: |
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F${PDFIUM_RELEASE}/pdfium-linux-x64.tgz" \
            -o "$RUNNER_TEMP/pdfium.tgz"
          echo "${PDFIUM_SHA256}  $RUNNER_TEMP/pdfium.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pdfium"
          tar -xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium" lib/libpdfium.so
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/pdfium/lib" >> "$GITHUB_ENV"
          echo "LEKTON_REQUIRE_PDFIUM=1" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: cargo test --features ssr --test '*' -- --test-threads=1
